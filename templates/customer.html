<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thông tin khách hàng</title><style>body{max-width:680px;margin:0 auto;padding:28px 18px;font-family:Arial;background:#f4f7f9;color:#17202a}main{background:#fff;padding:24px;border-radius:12px}h1{color:#087f8c}dt{margin-top:16px;font-weight:bold;color:#5b6870}dd{margin:4px 0 0;font-size:1.1rem;word-break:break-word}.checkin{margin:24px 0;padding:16px;border-radius:8px;background:#eef5f5}.checkin button{padding:12px 18px;border:0;border-radius:6px;color:#fff;background:#087f8c;font-size:1rem}.done{color:#087f8c;font-weight:bold}</style></head><body><main><h1>{{ profile.name }}</h1><div class="checkin">{% if profile.get('checkin_at') %}<p class="done">Đã check-in</p><small>Thời gian UTC: {{ profile.checkin_at }}</small>{% else %}<p>Vui lòng bấm nút để xác nhận tham dự.</p><form method="post" action="{{ url_for('checkin', customer_id=request.view_args.customer_id) }}"><button type="submit">Check-in điểm danh</button></form>{% endif %}</div><dl>{% for field, value in profile.fields.items() %}<dt>{{ field }}</dt><dd>{{ value or "Chưa cập nhật" }}</dd>{% endfor %}</dl></main></body></html>
