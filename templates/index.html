<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR khách hàng</title>
  <style>
    body { max-width: 1000px; margin: 0 auto; padding: 32px 20px; font-family: Arial, sans-serif; background: #f4f7f9; color: #17202a; }
    main { background: #fff; padding: 28px; border-radius: 12px; }
    form { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 18px; background: #eef5f5; border-radius: 8px; }
    button { padding: 11px 16px; border: 0; border-radius: 6px; color: #fff; background: #087f8c; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; margin-top: 24px; }
    .card { text-align: center; padding: 16px; border: 1px solid #dbe4e7; border-radius: 8px; }
    .card img { width: 160px; max-width: 100%; }
    a { color: #087f8c; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>Tạo mã QR khách hàng</h1>
    <p>Chọn file Excel để tạo mã QR riêng cho từng khách.</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="excel_file" accept=".xlsx,.xls,.csv" required>
      <label><input type="checkbox" name="offline_qr"> QR offline, không cần Wi-Fi hoặc Internet</label>
      <button type="submit">Tạo mã QR</button>
    </form>
    {% if profiles %}
      <h2>Danh sách QR đã tạo</h2>
      <div class="grid">
      {% for customer_id, profile in profiles.items() %}
        <article class="card">
          <img src="{{ url_for('qr_image', filename=profile.qr_filename) }}" alt="QR">
          <strong>{{ profile.name }}</strong>
          <p><a href="{{ url_for('customer', customer_id=customer_id) }}">Mở trang thông tin</a></p>
          <a href="{{ url_for('qr_image', filename=profile.qr_filename) }}" download>Tải ảnh QR</a>
        </article>
      {% endfor %}
      </div>
    {% endif %}
  </main>
</body>
</html>
