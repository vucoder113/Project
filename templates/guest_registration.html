<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký khách mời</title><style>body{max-width:680px;margin:0 auto;padding:24px 16px;font-family:"Segoe UI",Arial,sans-serif;background:#f4f7f9;color:#17202a}main{background:#fff;padding:24px;border-radius:12px}h1{color:#087f8c;font-size:2rem;letter-spacing:-.02em}label{display:block;margin-top:14px;font-weight:650}input{box-sizing:border-box;width:100%;margin-top:6px;padding:11px;border:1px solid #cbd7db;border-radius:6px;font:15px "Segoe UI",Arial,sans-serif}button{margin-top:22px;padding:12px 18px;border:0;border-radius:6px;color:#fff;background:#087f8c;font-size:1rem;font-weight:700}.error{color:#b42318;font-weight:bold}.code-note{padding:10px 12px;border-left:3px solid #c89945;background:#f8f3e8;color:#6d5a35}</style></head><body><main><h1>Đăng ký khách mời</h1><p>Nhập thông tin để tạo thiệp và mã QR riêng.</p><p class="code-note">Mã khách hàng sẽ được hệ thống tự cấp, bắt đầu từ OL01.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% for field in fields %}<label>{{ field }}{% if field == "Họ tên" %} *{% endif %}<input name="{{ field }}" type="text" {% if field == "Họ tên" %}required{% endif %}></label>{% endfor %}<button type="submit">Tạo QR của tôi</button></form></main></body></html>
